# Tests on every push and pull request. On a tag like v0.1.0-beta.1 it also builds the installers for Linux, Windows and
# macOS and prepares a DRAFT release (you read it, then publish it). Nothing is published automatically.
name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04   # an old base on purpose: the Linux program needs at least the C library of its builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: moly-go/go.mod
          cache-dependency-path: moly-go/go.sum
      - name: Go vet and tests
        working-directory: moly-go
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Windows and macOS builds still compile (Go code only, no C library)
        working-directory: moly-go
        run: |
          GOOS=windows CGO_ENABLED=0 go vet .
          GOOS=darwin  CGO_ENABLED=0 go vet .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: moly-extension/package-lock.json
      - name: Extension build and the tests that must pass
        working-directory: moly-extension
        run: |
          npm ci
          npm run build
          npx vitest run

  extension:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: moly-extension/package-lock.json
      - name: Two packages of the extension
        working-directory: moly-extension
        run: |
          npm ci
          VERSION=$(tr -d ' \n' < ../installer/VERSION)
          mkdir -p ../dist
          # The beta package carries a fixed key, so its ID is the one the installers register (load it unpacked).
          MOLY_BETA=1 npm run build
          (cd dist && zip -qr "../../dist/moly-extension-beta-$VERSION.zip" .)
          # The store package has no key: the Web Store assigns its own ID.
          npm run build
          (cd dist && zip -qr "../../dist/moly-extension-store-$VERSION.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/moly-extension-*.zip

  browser:
    # Chromium with the extension, the native host and the installed program, all together (installer/e2e).
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: moly-go/go.mod
          cache-dependency-path: moly-go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd moly-extension && npm ci
      - run: installer/e2e/run.sh

  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: moly-go/go.mod
          cache-dependency-path: moly-go/go.sum
      - name: Installer end to end test
        run: installer/linux/test-install.sh
      - name: Build the package
        run: installer/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/moly-*-linux-*.tar.gz*

  windows:
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: moly-go/go.mod
          cache-dependency-path: moly-go/go.sum
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        shell: pwsh
        run: |
          # build.ps1 needs at least one extension ID. A test build uses a placeholder; a tag build must have the real ones.
          if ($env:GITHUB_REF -like 'refs/tags/*') { & ./installer/windows/build.ps1 }
          else { Add-Content installer/extension-ids.txt 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'; & ./installer/windows/build.ps1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/moly-setup-*.exe*

  macos:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: moly-go/go.mod
          cache-dependency-path: moly-go/go.sum
      - name: Build the package (arm64 + x86_64)
        run: installer/macos/build.sh
      - name: The program starts
        run: |
          mkdir t && tar -xzf dist/moly-*-macos-universal.tar.gz -C t
          for d in t/moly-*; do "$d/moly" --version; done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/moly-*-macos-*.tar.gz*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, extension, browser]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: A release needs real extension IDs
        run: |
          if ! grep -qv '^[[:space:]]*\(#\|$\)' installer/extension-ids.txt; then
            echo "installer/extension-ids.txt has no extension ID: fill it with the store IDs and tag again." >&2; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum -- * | grep -v '\.sha256' > SHA256SUMS && cat SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --prerelease --title "Moly $GITHUB_REF_NAME" \
            --notes "Beta. Installers are not code-signed yet (Windows shows 'Windows protected your PC'; on a Mac use Open Anyway). See INSTALL.md." \
            artifacts/*
