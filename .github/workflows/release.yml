# Tests on every push and pull request. On a tag like v0.1.0-beta.1 it also builds the installers for Linux, Windows and
# macOS and prepares a DRAFT release (you read it, then publish it). Nothing is published automatically.
name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04   # an old base on purpose: the Linux program needs at least the C library of its builder
    steps:
      - uses: actions/checkout@v4
      - name: Every place that carries the version agrees (and the tag, on a tag)
        run: scripts/check-version.sh "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"
      - uses: actions/setup-go@v5
        with:
          go-version-file: moly-go/go.mod
          cache-dependency-path: moly-go/go.sum
      - name: Go vet and tests
        working-directory: moly-go
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Windows and macOS builds still compile (Go code only, no C library)
        working-directory: moly-go
        run: |
          GOOS=windows CGO_ENABLED=0 go vet .
          GOOS=darwin  CGO_ENABLED=0 go vet .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: moly-extension/package-lock.json
      - name: Extension build and the tests that must pass
        working-directory: moly-extension
        run: |
          npm ci
          npm run build
          npx vitest run

  extension:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: moly-extension/package-lock.json
      - name: Two packages of the extension
        working-directory: moly-extension
        run: |
          npm ci
          VERSION=$(tr -d ' \n' < ../installer/VERSION)
          mkdir -p ../dist
          # The beta package carries a fixed key, so its ID is the one the installers register (load it unpacked).
          MOLY_BETA=1 npm run build
          (cd dist && zip -qr "../../dist/moly-extension-beta-$VERSION.zip" .)
          # The store package has no key: the Web Store assigns its own ID.
          npm run build
          (cd dist && zip -qr "../../dist/moly-extension-store-$VERSION.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/moly-extension-*.zip

  browser:
    # Chromium with the extension, the native host and the installed program, all together (installer/e2e).
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: moly-go/go.mod
          cache-dependency-path: moly-go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd moly-extension && npm ci
      - run: installer/e2e/run.sh

  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: moly-go/go.mod
          cache-dependency-path: moly-go/go.sum
      - name: Installer end to end test
        run: installer/linux/test-install.sh
      - name: Build the package
        run: installer/linux/build.sh
      - name: The .deb (double-click installer) builds and checks out
        run: installer/linux/test-deb.sh
      - name: The .deb installs and removes with apt in a clean Debian
        run: installer/linux/test-deb-apt.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/moly-*-linux-*.tar.gz*
            dist/moly_*.deb*

  windows:
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: moly-go/go.mod
          cache-dependency-path: moly-go/go.sum
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        shell: pwsh
        run: |
          # build.ps1 needs at least one extension ID. A test build uses a placeholder; a tag build must have the real ones.
          if ($env:GITHUB_REF -like 'refs/tags/*') { & ./installer/windows/build.ps1 }
          else { Add-Content installer/extension-ids.txt 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'; & ./installer/windows/build.ps1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/moly-setup-*.exe*

  macos:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: moly-go/go.mod
          cache-dependency-path: moly-go/go.sum
      - name: Build the package (arm64 + x86_64)
        run: installer/macos/build.sh
      - name: The program starts
        run: |
          mkdir t && tar -xzf dist/moly-*-macos-universal.tar.gz -C t
          for d in t/moly-*; do "$d/moly" --version; done
      - name: The .pkg (double-click installer)
        run: |
          installer/macos/build-pkg.sh
          # The runner allows sudo: install it for real, look at what it did, and remove it again.
          sudo installer -pkg dist/moly-*-macos-universal.pkg -target /
          /usr/local/lib/moly/moly --version
          test -f "/Library/Google/Chrome/NativeMessagingHosts/com.moly.backend_host.json"
          sudo /usr/local/lib/moly/uninstall.sh
          test ! -e /usr/local/lib/moly
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/moly-*-macos-*.tar.gz*
            dist/moly-*-macos-*.pkg*

  # The Android APK of the same tag (signed in mobile.yml; the same version number as everything else).
  android:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    uses: ./.github/workflows/mobile.yml
    secrets: inherit

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, extension, browser, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: A release needs real extension IDs
        run: |
          if ! grep -qv '^[[:space:]]*\(#\|$\)' installer/extension-ids.txt; then
            echo "installer/extension-ids.txt has no extension ID: fill it with the store IDs and tag again." >&2; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: The release holds the Android APK and its notes
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ls artifacts/moly-*.apk >/dev/null 2>&1 || { echo "No signed APK: set MOBILE_KEYSTORE_BASE64, MOBILE_KEYSTORE_PASSWORD and MOBILE_KEY_ALIAS, then tag again." >&2; exit 1; }
          [ -f "moly-mobile/release-notes/$VERSION.md" ] || { echo "Write moly-mobile/release-notes/$VERSION.md before tagging $GITHUB_REF_NAME." >&2; exit 1; }
      - name: Checksums
        run: cd artifacts && rm -f SHA256SUMS && sha256sum -- * | grep -v '\.sha256' > SHA256SUMS && cat SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          {
            echo "Install the Moly app on your computer. Linux and Mac: open a terminal and run: curl -fsSL https://nireus79.github.io/Moly/install.sh | sh . Windows: download and run the moly-setup file. Then press Check again in the extension. Beta: not code-signed yet (Windows shows 'Windows protected your PC'; on a Mac use Open Anyway). See INSTALL.md."
            echo
            echo "## Android"
            echo
            cat "moly-mobile/release-notes/$VERSION.md"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --latest --title "Moly $GITHUB_REF_NAME" --notes-file notes.md artifacts/*

  # Uploads the store package as a new DRAFT version of the existing Web Store item. It does not submit it for review:
  # you press Submit in the dashboard. The item must already exist (the first upload is made by hand), and the job waits for
  # your approval on the "chrome-web-store" environment (Settings > Environments > Required reviewers).
  # Secrets: CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN, CWS_EXTENSION_ID.
  publish-store:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [extension, release]
    runs-on: ubuntu-22.04
    environment: chrome-web-store
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: artifacts
      - name: Upload to the Chrome Web Store (no publish)
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          set -euo pipefail
          # Without the secrets (a store review is open, or the upload is done by hand) there is nothing to upload: say so, stay green.
          for v in CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN CWS_EXTENSION_ID; do
            [ -n "${!v}" ] || { echo "::notice::Secret $v is not set: nothing uploaded to the Chrome Web Store."; exit 0; }
          done
          ZIP=$(ls artifacts/moly-extension-store-*.zip)
          echo "Uploading $ZIP"
          TOKEN=$(curl -sS --fail-with-body https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" -d grant_type=refresh_token | jq -r .access_token)
          [ -n "$TOKEN" ] && [ "$TOKEN" != null ] || { echo "No access token: check the refresh token." >&2; exit 1; }
          RESP=$(curl -sS --fail-with-body -X PUT \
            -H "Authorization: Bearer $TOKEN" -H "x-goog-api-version: 2" \
            -T "$ZIP" "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_EXTENSION_ID")
          echo "$RESP" | jq .
          STATE=$(echo "$RESP" | jq -r .uploadState)
          if [ "$STATE" != SUCCESS ]; then
            echo "Upload state is $STATE, not SUCCESS." >&2; exit 1
          fi
          echo "Uploaded as a draft. Open the dashboard and press Submit for review."
