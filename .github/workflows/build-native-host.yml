name: Build Native Host Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Linux binary
        run: |
          cd moly-installer/native-host
          bash build-linux.sh

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: moly-installer/native-host/releases/moly-native-host-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build macOS binary
        run: |
          cd moly-installer/native-host
          bash build-macos.sh

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: moly-installer/native-host/releases/moly-native-host-macos-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Windows binary
        run: |
          cd moly-installer\native-host
          .\build-windows.bat

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: moly-installer/native-host/releases/moly-native-host-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
