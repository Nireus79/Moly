name: Build Native Host Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install pyinstaller
      - run: cd moly-installer/native-host && bash build-linux.sh
      - name: Upload Linux binary
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          REPO=${{ github.repository }}
          TOKEN=${{ secrets.GITHUB_TOKEN }}

          # Get or create release
          RELEASE=$(curl -s -H "Authorization: token $TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG")
          RELEASE_ID=$(echo "$RELEASE" | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            RELEASE=$(curl -s -X POST \
              -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/releases" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"Release $TAG\",\"draft\":false,\"prerelease\":false}")
            RELEASE_ID=$(echo "$RELEASE" | jq -r '.id')
          fi

          echo "Uploading Linux binary to release $RELEASE_ID..."
          curl -s -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@moly-installer/native-host/releases/moly-native-host-linux-x64.tar.gz" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=moly-native-host-linux-x64.tar.gz"

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install pyinstaller
      - run: cd moly-installer/native-host && bash build-macos.sh
      - name: Upload macOS binaries
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          REPO=${{ github.repository }}
          TOKEN=${{ secrets.GITHUB_TOKEN }}

          # Get or create release
          RELEASE=$(curl -s -H "Authorization: token $TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG")
          RELEASE_ID=$(echo "$RELEASE" | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            RELEASE=$(curl -s -X POST \
              -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/releases" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"Release $TAG\",\"draft\":false,\"prerelease\":false}")
            RELEASE_ID=$(echo "$RELEASE" | jq -r '.id')
          fi

          echo "Uploading macOS binaries to release $RELEASE_ID..."
          for file in moly-installer/native-host/releases/moly-native-host-macos-*.tar.gz; do
            if [ -f "$file" ]; then
              echo "Uploading $(basename $file)..."
              curl -s -X POST \
                -H "Authorization: token $TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$file" \
                "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$(basename $file)"
            fi
          done

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install pyinstaller
      - run: cd moly-installer\native-host && .\build-windows.bat
      - name: Upload Windows binary
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          REPO=${{ github.repository }}
          TOKEN=${{ secrets.GITHUB_TOKEN }}

          # Get or create release
          RELEASE=$(curl -s -H "Authorization: token $TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG")
          RELEASE_ID=$(echo "$RELEASE" | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            RELEASE=$(curl -s -X POST \
              -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/releases" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"Release $TAG\",\"draft\":false,\"prerelease\":false}")
            RELEASE_ID=$(echo "$RELEASE" | jq -r '.id')
          fi

          echo "Uploading Windows binary to release $RELEASE_ID..."
          curl -s -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@moly-installer/native-host/releases/moly-native-host-windows-x64.zip" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=moly-native-host-windows-x64.zip"
