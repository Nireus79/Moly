<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moly Sidebar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #1f2937;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-left: 1px solid #e5e7eb;
    }

    .sidebar-header {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .sidebar-header h3 {
      font-size: 16px;
      margin: 0;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .header-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: background 0.2s;
    }

    .header-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .section {
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .detected-message {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
    }

    .message-sender {
      font-weight: 600;
      color: #0369a1;
      font-size: 10px;
      margin-bottom: 4px;
    }

    .message-text {
      color: #1f2937;
      line-height: 1.4;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-small {
      padding: 6px 10px;
      border: 1px solid #d1d5db;
      background: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn-small.active {
      background: #6366f1;
      color: white;
      border-color: #6366f1;
    }

    .btn-small:hover:not(.active) {
      border-color: #9ca3af;
    }

    .open-chat-btn {
      width: 100%;
      padding: 8px 12px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .open-chat-btn:hover {
      background: #4f46e5;
    }

    .empty-state {
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      padding: 20px 0;
    }

    .scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .scrollbar::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="sidebar-wrapper scrollbar">
    <div class="sidebar-header">
      <h3>Moly</h3>
      <div class="header-actions">
        <button class="header-btn" id="pin-btn" title="Pin sidebar">P</button>
        <button class="header-btn" id="close-btn" title="Close sidebar">X</button>
      </div>
    </div>

    <div class="sidebar-content">
      <!-- Detected Message -->
      <div class="section">
        <div class="section-title">Detected Message</div>
        <div id="detected-msg" class="detected-message">
          <div class="empty-state">No message detected</div>
        </div>
      </div>

      <!-- Mode Selection -->
      <div class="section">
        <div class="section-title">Mode</div>
        <div class="control-row">
          <button class="btn-small active" data-mode="socratic">Socratic</button>
          <button class="btn-small" data-mode="direct">Direct</button>
        </div>
      </div>

      <!-- Context Selection -->
      <div class="section">
        <div class="section-title">Context</div>
        <div class="control-row">
          <button class="btn-small active" data-context="formal">Formal</button>
          <button class="btn-small" data-context="friendly">Friendly</button>
          <button class="btn-small" data-context="dating">Dating</button>
        </div>
      </div>

      <!-- Open Chat Button -->
      <div class="section">
        <button class="open-chat-btn" id="open-chat-btn">Open Chat</button>
      </div>
    </div>
  </div>

</body>
</html>
