<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moly - Messaging Coach</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #moly-container { width: 100%; height: 100%; overflow-y: auto; }
    .loading { padding: 20px; text-align: center; color: #999; }
    .error { padding: 20px; color: #d32f2f; font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="moly-container">
    <div class="loading">Loading Moly...</div>
  </div>
  <script>
    const BACKEND_URL = 'http://127.0.0.1:11436';
    const MAX_RETRIES = 30;
    let retries = 0;

    async function loadMolyFromBackend() {
      const container = document.getElementById('moly-container');

      try {
        const response = await fetch(`${BACKEND_URL}/sidebar.html`);
        if (!response.ok) throw new Error('Failed to load');

        const html = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const contentDiv = doc.querySelector('.container');

        if (contentDiv) {
          container.innerHTML = contentDiv.innerHTML;

          const styles = doc.querySelectorAll('style');
          styles.forEach(style => {
            const newStyle = document.createElement('style');
            newStyle.textContent = style.textContent;
            document.head.appendChild(newStyle);
          });

          const scripts = doc.querySelectorAll('script');
          scripts.forEach(script => {
            const newScript = document.createElement('script');
            newScript.textContent = script.textContent;
            document.body.appendChild(newScript);
          });
        } else {
          container.innerHTML = html;
        }
      } catch (error) {
        retries++;

        if (retries >= MAX_RETRIES) {
          container.innerHTML = `
            <div class="error">
              <strong>Moly Backend Unavailable</strong>
              <p>The Moly backend service is not responding. Ensure the Go server or Electron app is running on port 11436.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = `<div class="loading">Connecting to Moly... (${retries}/${MAX_RETRIES})</div>`;
        setTimeout(loadMolyFromBackend, 1000);
      }
    }

    loadMolyFromBackend();
  </script>
</body>
</html>
