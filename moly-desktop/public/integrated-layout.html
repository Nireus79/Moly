<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moly - Ethical Communication Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
    }

    body {
      display: flex;
      flex-direction: row;
    }

    /* Sidebar */
    #sidebar-container {
      width: 420px;
      height: 100vh;
      background: #fff;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.08);
    }

    .sidebar-header {
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-weight: 600;
      font-size: 14px;
      border-bottom: 1px solid #e0e0e0;
      text-align: center;
    }

    #sidebar-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    #sidebar-content::-webkit-scrollbar {
      width: 8px;
    }

    #sidebar-content::-webkit-scrollbar-track {
      background: transparent;
    }

    #sidebar-content::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 4px;
    }

    #sidebar-content::-webkit-scrollbar-thumb:hover {
      background: #999;
    }

    .sidebar-loading {
      padding: 20px;
      text-align: center;
      color: #999;
      font-size: 14px;
    }

    .sidebar-error {
      padding: 20px;
      color: #d32f2f;
      font-size: 13px;
      line-height: 1.5;
    }

    /* Content area */
    #content-container {
      flex: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fafafa;
    }

    .content-header {
      padding: 16px 24px;
      background: white;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      color: #666;
    }

    .content-header-title {
      font-weight: 500;
      color: #333;
    }

    .content-header-buttons {
      display: flex;
      gap: 8px;
    }

    .content-header button {
      padding: 6px 12px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      color: #333;
      transition: all 0.2s;
    }

    .content-header button:hover {
      border-color: #667eea;
      color: #667eea;
    }

    #content-frame {
      flex: 1;
      border: none;
      background: white;
    }

    /* Loading indicator */
    .loading-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #999;
      gap: 16px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #f0f0f0;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      #sidebar-container {
        width: 100%;
        height: auto;
        max-height: 40vh;
        border-right: none;
        border-bottom: 1px solid #e0e0e0;
      }

      #content-container {
        height: auto;
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div id="sidebar-container">
    <div class="sidebar-header">Moly Assistant</div>
    <div id="sidebar-content">
      <div class="sidebar-loading">Loading Moly...</div>
    </div>
  </div>

  <div id="content-container">
    <div class="content-header">
      <span class="content-header-title">Moly - Ethical Communication Guide</span>
      <div class="content-header-buttons">
        <button onclick="reloadContent()">Reload</button>
        <button onclick="goHome()">Home</button>
      </div>
    </div>
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <span>Initializing Moly...</span>
    </div>
  </div>

  <script>
    const BACKEND_URL = 'http://127.0.0.1:11436';
    const RETRY_INTERVAL = 1000;
    const MAX_RETRIES = 30;

    let retries = 0;
    let backendReady = false;

    async function loadSidebar() {
      const container = document.getElementById('sidebar-content');

      try {
        const response = await fetch(`${BACKEND_URL}/sidebar.html`);
        if (!response.ok) throw new Error('Failed to load');

        const html = await response.text();

        // Extract content from the full HTML (remove html/body/container tags)
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const contentDiv = doc.querySelector('.container');

        if (contentDiv) {
          container.innerHTML = contentDiv.innerHTML;
          // Copy styles from the original document
          const styles = doc.querySelectorAll('style');
          styles.forEach(style => {
            if (!document.querySelector(`style[data-moly-sidebar]`)) {
              const newStyle = document.createElement('style');
              newStyle.setAttribute('data-moly-sidebar', 'true');
              newStyle.textContent = style.textContent;
              document.head.appendChild(newStyle);
            }
          });
          // Copy scripts if any
          const scripts = doc.querySelectorAll('script');
          scripts.forEach(script => {
            const newScript = document.createElement('script');
            newScript.textContent = script.textContent;
            document.body.appendChild(newScript);
          });
        } else {
          container.innerHTML = html;
        }

        backendReady = true;
        loadContent();
      } catch (error) {
        retries++;

        if (retries >= MAX_RETRIES) {
          container.innerHTML = `
            <div class="sidebar-error">
              <strong>Moly Backend Unavailable</strong>
              <p>The Moly backend service is not responding. Please ensure the Go server is running on port 11436.</p>
              <p style="margin-top: 8px; font-size: 12px;">Retried ${retries} times.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = `
          <div class="sidebar-loading">
            Connecting to Moly... (${retries}/${MAX_RETRIES})
          </div>
        `;

        setTimeout(loadSidebar, RETRY_INTERVAL);
      }
    }

    function loadContent() {
      const container = document.getElementById('content-container');
      container.innerHTML = `
        <div class="content-header">
          <span class="content-header-title">Moly - Ethical Communication Guide</span>
          <div class="content-header-buttons">
            <button onclick="reloadContent()">Reload</button>
            <button onclick="goHome()">Home</button>
          </div>
        </div>
        <iframe
          id="content-frame"
          src="${BACKEND_URL}/sidebar.html"
          sandbox="allow-same-origin allow-scripts allow-forms"
        ></iframe>
      `;
    }

    function reloadContent() {
      const frame = document.getElementById('content-frame');
      if (frame) {
        frame.src = frame.src;
      }
    }

    function goHome() {
      const frame = document.getElementById('content-frame');
      if (frame) {
        frame.src = `${BACKEND_URL}/sidebar.html`;
      }
    }

    loadSidebar();

    setInterval(() => {
      if (!backendReady) {
        fetch(`${BACKEND_URL}/api/status`)
          .then(() => {
            if (!backendReady) {
              backendReady = true;
              retries = 0;
              loadSidebar();
            }
          })
          .catch(() => {});
      }
    }, RETRY_INTERVAL);
  </script>
</body>
</html>
